<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>累计输赢</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #667085; --line: #e3e6eb; --axis: #b4bac4; --accent: #2f6fdf; --bad: #c4372d;
  --s0: #2a78d6; --s1: #eb6834; --s2: #1baf7a; --s3: #eda100; --s4: #e87ba4; --s5: #008300; --s6: #6250d6; --s7: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1a1f27; --ink: #e5e8ee; --muted: #9aa3b2; --line: #2b323d; --axis: #4a5361; --accent: #6f9cf0; --bad: #f07167;
    --s0: #3987e5; --s1: #d95926; --s2: #199e70; --s3: #c98500; --s4: #d55181; --s5: #008300; --s6: #9085e9; --s7: #e66767;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
h1 { font-size: 17px; margin: 0; font-weight: 600; }
h2 { font-size: 15px; margin: 0; font-weight: 600; overflow-wrap: anywhere; }
a { color: var(--accent); }
.grow { flex: 1; }
main { padding: 14px 20px 40px; display: flex; flex-direction: column; gap: 14px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.note { margin: 0; color: var(--muted); font-size: 13px; }
.bad { color: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.key { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 2px 10px; font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.key:hover { border-color: var(--muted); }
.key:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.key[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
.key[aria-pressed="false"] .swatch { opacity: .25; }
.swatch { width: 14px; height: 3px; border-radius: 2px; flex: none; }
.chart { position: relative; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { font-size: 12px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart text.end { fill: var(--ink); }
.tip { position: absolute; top: 0; left: 0; z-index: 2; min-width: 170px; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 16px rgba(0, 0, 0, .18); padding: 6px 10px; font-size: 12px; font-variant-numeric: tabular-nums; }
.tip-head { color: var(--muted); margin-bottom: 3px; }
.tip-row { display: flex; align-items: center; gap: 6px; line-height: 1.55; }
.tip-row span:last-child { margin-left: auto; padding-left: 14px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-weight: 500; font-size: 12px; color: var(--muted); }
th:first-child, td:first-child { text-align: left; }
tr:last-child td { border-bottom: 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>累计输赢</h1>
  <span class="grow"></span>
  <a href="history">← 牌局回放</a>
</header>
<main id="main"><p class="note" id="status">加载中…</p></main>
<script>
'use strict';
const SVG = 'http://www.w3.org/2000/svg';
const COLORS = Array.from({length: 8}, (_, i) => `var(--s${i})`);

const num = (v) => Math.abs(v).toLocaleString('en-US');
const signed = (v) => (v === 0 ? '0' : (v > 0 ? '+' : '−') + num(v));
const compact = (v) => {
  if (v === 0) return '0';
  const a = Math.abs(v);
  return (v > 0 ? '+' : '−') + (a >= 1000 ? `${+(a / 1000).toFixed(1)}K` : a);
};

function el(tag, props, parent) {
  const node = document.createElement(tag);
  Object.assign(node, props);
  if (parent) parent.append(node);
  return node;
}

function svgEl(tag, attrs, parent) {
  const node = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  if (parent) parent.append(node);
  return node;
}

function niceStep(span, count) {
  const raw = span / Math.max(count, 1);
  const mag = 10 ** Math.floor(Math.log10(raw));
  const norm = raw / mag;
  return (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
}

function ticks(lo, hi, count) {
  if (lo === hi) return [lo];
  const step = niceStep(hi - lo, count);
  const out = [];
  for (let v = Math.floor(lo / step) * step; v <= Math.ceil(hi / step) * step + step / 2; v += step) out.push(Math.round(v));
  return out;
}

// Spread labels vertically so they do not overlap; each keeps a leader line back to its true position.
function spread(labels, gap, top, bottom) {
  labels.sort((a, b) => a.y - b.y);
  labels.forEach((l, i) => { l.ly = Math.max(l.y, i ? labels[i - 1].ly + gap : top); });
  const last = labels[labels.length - 1];
  if (last && last.ly > bottom) {
    last.ly = bottom;
    for (let i = labels.length - 2; i >= 0; i--) labels[i].ly = Math.min(labels[i].ly, labels[i + 1].ly - gap);
  }
}

function renderRun(run, main) {
  const box = el('section', {}, main);
  el('h2', {textContent: run.title}, box);
  const hands = run.hands;
  const note = `第 ${hands[0].toLocaleString('en-US')}–${hands[hands.length - 1].toLocaleString('en-US')} 手，横轴是手数，纵轴是累计输赢筹码。`
    + `1BB = ${run.big_blind} 筹码，未扣抽水。筹码重置（重新买入、超线重进、每手回到初始筹码）不计入输赢。点图例隐藏或显示一条线，鼠标移到图例上突出这条线。`;
  el('p', {className: 'note', textContent: note}, box);
  if (run.unbalanced_hands) {
    el('p', {className: 'note bad', textContent: `有 ${run.unbalanced_hands} 手各座盈亏合计不为 0，这份数据要先核对。`}, box);
  }

  const hidden = new Set();
  let hot = null;
  const legend = el('div', {className: 'legend'}, box);
  legend.setAttribute('role', 'group');
  legend.setAttribute('aria-label', '选择要显示的座位');
  const chart = el('div', {className: 'chart'}, box);
  const colorOf = (bot) => COLORS[run.bots.indexOf(bot) % COLORS.length];

  run.bots.forEach((bot) => {
    const key = el('button', {type: 'button', className: 'key'}, legend);
    key.setAttribute('aria-pressed', 'true');
    el('i', {className: 'swatch'}, key).style.background = colorOf(bot);
    key.append(bot);
    key.addEventListener('click', () => {
      if (hidden.has(bot)) hidden.delete(bot);
      else hidden.add(bot);
      key.setAttribute('aria-pressed', String(!hidden.has(bot)));
      draw();
    });
    const setHot = (value) => {
      if (hot !== value) {
        hot = value;
        draw();
      }
    };
    key.addEventListener('pointerenter', () => setHot(bot));
    key.addEventListener('pointerleave', () => setHot(null));
    key.addEventListener('focus', () => setHot(bot));
    key.addEventListener('blur', () => setHot(null));
  });

  let low = 0;
  let high = 0;
  for (const bot of run.bots) {
    for (const v of run.series[bot]) {
      if (v < low) low = v;
      if (v > high) high = v;
    }
  }
  const yTicks = ticks(low, high, 8);
  const yMin = yTicks[0];
  const yMax = yTicks[yTicks.length - 1];
  const xStart = hands[0];
  const xEnd = hands[hands.length - 1];
  const xStep = niceStep(xEnd - xStart, 5);
  const xTicks = [];
  for (let v = Math.ceil(xStart / xStep) * xStep; v <= xEnd; v += xStep) xTicks.push(v);
  // Hand numbers are consecutive within a run, except a gap would only widen a step; look up by search.
  const indexOfHand = (hand) => {
    let lo = 0;
    let hi = hands.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (hands[mid] < hand) lo = mid + 1;
      else hi = mid;
    }
    return lo > 0 && hand - hands[lo - 1] < hands[lo] - hand ? lo - 1 : lo;
  };

  function draw() {
    chart.replaceChildren();
    const width = Math.max(chart.clientWidth, 280);
    const height = Math.round(Math.max(380, Math.min(640, width * 0.5)));
    const wide = width >= 640;
    const svg = svgEl('svg', {viewBox: `0 0 ${width} ${height}`, role: 'img', 'aria-label': '每个座位随手数累计输赢筹码的折线图'}, chart);
    const measure = (text, cls) => {
      const t = svgEl('text', cls ? {class: cls} : {}, svg);
      t.textContent = text;
      const w = t.getComputedTextLength();
      t.remove();
      return w;
    };
    const shown = run.bots.filter((b) => !hidden.has(b));
    const lastIndex = hands.length - 1;
    const left = Math.ceil(Math.max(...yTicks.map((t) => measure(compact(t))))) + 12;
    let right = 16;
    if (wide && shown.length) {
      right = 34 + Math.ceil(Math.max(...shown.map((b) => measure(`${b} ${signed(run.series[b][lastIndex])}`, 'end'))));
    }
    const top = 10;
    const bottom = 42;
    const plotW = width - left - right;
    const plotH = height - top - bottom;
    const x = (hand) => left + ((hand - xStart) / (xEnd - xStart || 1)) * plotW;
    const y = (v) => top + ((yMax - v) / (yMax - yMin || 1)) * plotH;
    const fade = (bot) => (hot && hot !== bot ? 0.15 : 1);

    for (const t of yTicks) {
      const gy = y(t);
      svgEl('line', {x1: left, x2: left + plotW, y1: gy, y2: gy, 'stroke-width': 1, style: `stroke: var(${t === 0 ? '--axis' : '--line'})`}, svg);
      const label = svgEl('text', {x: left - 8, y: gy, dy: '0.32em', 'text-anchor': 'end'}, svg);
      label.textContent = compact(t);
    }
    for (const t of xTicks) {
      const anchor = t === xStart ? 'start' : t === xEnd ? 'end' : 'middle';
      const label = svgEl('text', {x: x(t), y: top + plotH + 18, 'text-anchor': anchor}, svg);
      label.textContent = t.toLocaleString('en-US');
    }
    const xName = svgEl('text', {x: left + plotW / 2, y: height - 4, 'text-anchor': 'middle'}, svg);
    xName.textContent = '手数';

    const order = hot ? [...shown.filter((b) => b !== hot), ...shown.filter((b) => b === hot)] : shown;
    for (const bot of order) {
      const values = run.series[bot];
      let d = '';
      for (let i = 0; i < values.length; i++) d += `${i ? 'L' : 'M'}${x(hands[i]).toFixed(1)} ${y(values[i]).toFixed(1)}`;
      svgEl('path', {d, fill: 'none', 'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'stroke-width': hot === bot ? 2.5 : 1.5,
        opacity: fade(bot), style: `stroke: ${colorOf(bot)}`}, svg);
    }

    const endX = x(xEnd);
    const labels = shown.map((bot) => ({bot, value: run.series[bot][lastIndex], y: y(run.series[bot][lastIndex])}));
    for (const l of labels) {
      svgEl('circle', {cx: endX, cy: l.y, r: 4, 'stroke-width': 2, opacity: fade(l.bot), style: `stroke: var(--panel); fill: ${colorOf(l.bot)}`}, svg);
    }
    if (wide && labels.length) {
      spread(labels, 16, top + 6, top + plotH - 2);
      const labelX = endX + 26;
      for (const l of labels) {
        svgEl('line', {x1: endX + 6, y1: l.y, x2: labelX - 4, y2: l.ly, 'stroke-width': 1, opacity: fade(l.bot), style: 'stroke: var(--axis)'}, svg);
        const t = svgEl('text', {class: 'end', x: labelX, y: l.ly, dy: '0.32em', opacity: fade(l.bot)}, svg);
        t.textContent = `${l.bot} ${signed(l.value)}`;
      }
    }

    const rule = svgEl('line', {y1: top, y2: top + plotH, 'stroke-width': 1, visibility: 'hidden', style: 'stroke: var(--muted)'}, svg);
    const dots = svgEl('g', {visibility: 'hidden'}, svg);
    const dot = new Map(shown.map((bot) => [bot, svgEl('circle', {r: 4, 'stroke-width': 2, style: `stroke: var(--panel); fill: ${colorOf(bot)}`}, dots)]));
    const tip = el('div', {className: 'tip', hidden: true}, chart);
    const overlay = svgEl('rect', {x: left, y: top, width: Math.max(plotW, 0), height: plotH, fill: 'transparent'}, svg);

    overlay.addEventListener('pointermove', (event) => {
      const rect = chart.getBoundingClientRect();
      const scale = rect.width / width;
      const mx = (event.clientX - rect.left) / scale;
      const my = (event.clientY - rect.top) / scale;
      const hand = xStart + ((mx - left) / (plotW || 1)) * (xEnd - xStart);
      const i = indexOfHand(Math.round(hand));
      const px = x(hands[i]);
      rule.setAttribute('x1', px);
      rule.setAttribute('x2', px);
      rule.setAttribute('visibility', 'visible');
      dots.setAttribute('visibility', 'visible');
      for (const [bot, c] of dot) {
        c.setAttribute('cx', px);
        c.setAttribute('cy', y(run.series[bot][i]));
      }
      const rows = [el('div', {className: 'tip-head', textContent: `第 ${hands[i].toLocaleString('en-US')} 手`})];
      for (const bot of [...shown].sort((a, b) => run.series[b][i] - run.series[a][i])) {
        const row = el('div', {className: 'tip-row'});
        el('i', {className: 'swatch'}, row).style.background = colorOf(bot);
        el('span', {textContent: bot}, row);
        el('span', {textContent: signed(run.series[bot][i])}, row);
        rows.push(row);
      }
      tip.replaceChildren(...rows);
      tip.hidden = false;
      const tw = tip.offsetWidth;
      const th = tip.offsetHeight;
      const cx = mx * scale;
      const cy = my * scale;
      const tx = cx + 14 + tw > rect.width ? cx - 14 - tw : cx + 14;
      const ty = Math.max(0, Math.min(cy - th / 2, rect.height - th));
      tip.style.transform = `translate(${Math.max(0, tx)}px, ${ty}px)`;
    });
    overlay.addEventListener('pointerleave', () => {
      rule.setAttribute('visibility', 'hidden');
      dots.setAttribute('visibility', 'hidden');
      tip.hidden = true;
    });
  }

  const wrap = el('div', {className: 'table-wrap'}, box);
  const table = el('table', {}, wrap);
  const head = el('tr', {}, el('thead', {}, table));
  for (const name of ['座位', '最终累计筹码', '折合 BB', '最高', '最低']) el('th', {textContent: name}, head);
  const body = el('tbody', {}, table);
  const rows = run.bots.map((bot) => {
    const values = run.series[bot];
    return {bot, final: values[values.length - 1], peak: Math.max(...values), trough: Math.min(...values)};
  }).sort((a, b) => b.final - a.final);
  for (const r of rows) {
    const tr = el('tr', {}, body);
    el('td', {textContent: r.bot}, tr);
    el('td', {textContent: signed(r.final)}, tr);
    el('td', {textContent: signed(r.final / run.big_blind)}, tr);
    el('td', {textContent: signed(r.peak)}, tr);
    el('td', {textContent: signed(r.trough)}, tr);
  }

  draw();
  let lastWidth = chart.clientWidth;
  new ResizeObserver(() => {
    if (chart.clientWidth !== lastWidth) {
      lastWidth = chart.clientWidth;
      draw();
    }
  }).observe(chart);
}

fetch('api/history/cumulative').then((r) => r.json()).then((body) => {
  const main = document.getElementById('main');
  const status = document.getElementById('status');
  if (!body.runs.length) {
    status.textContent = '这个回放服务读的牌谱没有整桌盈亏记录（只有 tools/wopo_arena 的 table/ 目录有）。';
    return;
  }
  status.remove();
  for (const run of body.runs) renderRun(run, main);
}).catch((e) => {
  document.getElementById('status').textContent = `加载失败：${e}`;
});
</script>
</body>
</html>
